[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chatgpt-chat-webui"
version = "0.1.0"
description = "ChatGPT web UI for chatgpt-chat-api (subscription chat quota, same-origin)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
# Sibling API package: install it from git or a local path BEFORE this
# package (it is not on PyPI), e.g.:
#   pip install "chatgpt-chat-api @ git+https://github.com/QuixThe2nd/chatgpt-chat-api.git"
#   pip install -e .
dependencies = [
    "chatgpt-chat-api",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[project.scripts]
chatgpt-chat-webui = "chatgpt_chat_webui.app:main"

[tool.setuptools]
packages = ["chatgpt_chat_webui"]

[tool.setuptools.package-data]
chatgpt_chat_webui = ["webui/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
