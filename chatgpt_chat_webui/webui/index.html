<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>ChatGPT App API — local console</title>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<link rel="stylesheet" href="/static/style.css">
</head>
<body class="app">
<a class="skip-link" href="#composer-input">Skip to message composer</a>

<div class="shell">
  <aside id="sidebar" class="sidebar">
    <div class="sidebar-brand">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true" focusable="false">
        <path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"></path>
      </svg>
      <span class="brand-name">ChatGPT</span>
      <span class="sr-only">local console</span>
      <button id="sidebar-toggle" class="icon-btn" type="button" aria-controls="sidebar" aria-expanded="true" aria-label="Toggle sidebar">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
          <rect x="3" y="4" width="18" height="16" rx="3"></rect>
          <line x1="9" y1="4" x2="9" y2="20"></line>
        </svg>
      </button>
    </div>

    <nav class="sidebar-nav" aria-label="Chat navigation">
      <button id="clear-btn" class="nav-row nav-row-primary" type="button">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
          <path d="M4 20l4-1L19 8a2 2 0 0 0-3-3L5 16z"></path>
        </svg>
        <span>New chat</span>
      </button>
    </nav>

    <section class="sidebar-recents" aria-label="Recent chats">
      <h2 class="sidebar-label">Recents</h2>
      <ul class="recent-list">
        <li>
          <button class="recent-row is-current" type="button" aria-current="true">
            <span class="recent-title">New chat</span>
          </button>
        </li>
      </ul>
    </section>

    <footer class="sidebar-account">
      <svg class="account-avatar" viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
        <circle cx="12" cy="12" r="9"></circle>
        <circle cx="12" cy="10" r="2.5"></circle>
        <path d="M7.5 16.5a4.5 4.5 0 0 1 9 0"></path>
      </svg>
      <span class="account-name">Local account</span>
      <span class="account-sub">chatgpt-app-api</span>
    </footer>
  </aside>

  <main class="main" aria-label="Chat">
    <header class="chat-header">
      <button id="menu-btn" class="icon-btn menu-trigger" type="button" aria-controls="sidebar" aria-expanded="false" aria-label="Open sidebar">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true" focusable="false">
          <line x1="4" y1="7" x2="20" y2="7"></line>
          <line x1="4" y1="12" x2="20" y2="12"></line>
          <line x1="4" y1="17" x2="20" y2="17"></line>
        </svg>
      </button>
      <h2 id="chat-title" class="chat-title">New chat</h2>
      <div class="chat-header-actions">
        <button class="icon-btn" type="button" disabled aria-label="Share (not available in local console)">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
            <path d="M12 4v11"></path>
            <polyline points="8 8 12 4 16 8"></polyline>
            <path d="M5 13v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"></path>
          </svg>
        </button>
        <button id="settings-btn" class="icon-btn" type="button" aria-haspopup="dialog" aria-expanded="false" aria-controls="settings-popover" aria-label="Settings">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true" focusable="false">
            <line x1="4" y1="7" x2="20" y2="7"></line>
            <circle cx="9" cy="7" r="2.2"></circle>
            <line x1="4" y1="15" x2="20" y2="15"></line>
            <circle cx="15" cy="15" r="2.2"></circle>
          </svg>
        </button>
      </div>
    </header>

    <section id="settings-popover" class="popover settings-popover" role="dialog" aria-label="Console settings" hidden>
      <button id="refresh-models" class="popover-row" type="button">Reload models</button>
      <label class="popover-row toggle-row" for="stream-toggle">
        <input type="checkbox" id="stream-toggle" checked>
        <span>Stream replies (SSE)</span>
      </label>
      <p id="health" class="health checking" role="status" aria-live="polite">
        <span class="dot" aria-hidden="true"></span>
        <span id="health-text">Checking backend…</span>
      </p>
    </section>

    <section id="empty-state" class="empty-state">
      <h1 class="empty-heading">Ready when you are.</h1>
    </section>

    <ol id="transcript" class="transcript" role="log" aria-label="Conversation transcript">
      <li id="transcript-empty" class="sr-only">No messages yet — say hello below.</li>
    </ol>

    <div class="feedback">
      <p id="request-status" role="status" aria-live="polite"></p>
      <p id="error" class="error" role="alert" aria-live="assertive" hidden></p>
    </div>

    <form id="composer" class="composer" autocomplete="off">
      <label class="sr-only" for="composer-input">Message ChatGPT</label>
      <button id="composer-plus" class="icon-btn composer-plus" type="button" disabled aria-label="Attach files (not available in local console)">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true" focusable="false">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
      </button>
      <textarea id="composer-input" rows="1" required
        placeholder="Message ChatGPT"></textarea>
      <button id="model-trigger" class="model-trigger" type="button" aria-haspopup="dialog" aria-expanded="false" aria-controls="model-popover">
        <span id="model-trigger-label">Pro</span>
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
          <polyline points="6 9 12 15 18 9"></polyline>
        </svg>
      </button>
      <button id="mic-btn" class="icon-btn composer-mic" type="button" disabled aria-label="Voice input (not available in local console)">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
          <rect x="9" y="4" width="6" height="11" rx="3"></rect>
          <path d="M6 11a6 6 0 0 0 12 0"></path>
          <line x1="12" y1="17" x2="12" y2="20"></line>
        </svg>
      </button>
      <button id="send-btn" class="send-btn" type="submit" aria-label="Send message">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
          <line x1="12" y1="19" x2="12" y2="5"></line>
          <polyline points="6 11 12 5 18 11"></polyline>
        </svg>
      </button>
      <button id="stop-btn" class="stop-btn" type="button" aria-label="Stop generating" disabled>
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true" focusable="false">
          <rect x="7" y="7" width="10" height="10" rx="1.5"></rect>
        </svg>
      </button>

      <div id="model-popover" class="popover model-popover" role="dialog" aria-label="Model options" hidden>
        <div id="effort-slider" class="effort-slider" role="slider" tabindex="0"
          aria-label="Power" aria-valuemin="0" aria-valuemax="4" aria-valuenow="4"
          aria-valuetext="Pro, 5 of 5. Use Left and Right arrow keys to adjust power">
          <div class="effort-track">
            <div class="effort-track-range">
              <div class="effort-fill"></div>
              <span class="effort-tick" data-step="0" aria-hidden="true"></span>
              <span class="effort-tick" data-step="1" aria-hidden="true"></span>
              <span class="effort-tick" data-step="2" aria-hidden="true"></span>
              <span class="effort-tick" data-step="3" aria-hidden="true"></span>
              <span class="effort-tick" data-step="4" aria-hidden="true"></span>
              <div class="effort-thumb" aria-hidden="true"></div>
            </div>
          </div>
        </div>
        <button id="advanced-trigger" class="popover-row popover-row-advanced" type="button" aria-haspopup="dialog" aria-expanded="false" aria-controls="advanced-popover">
          <span>Advanced</span>
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
            <polyline points="9 6 15 12 9 18"></polyline>
          </svg>
        </button>
      </div>

      <div id="advanced-popover" class="popover advanced-popover" role="dialog" aria-label="Advanced options" hidden>
        <h3 class="popover-title">
          <span>Advanced</span>
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
        </h3>
        <button id="model-list-trigger" class="popover-row" type="button" aria-haspopup="listbox" aria-expanded="false" aria-controls="model-list">
          <span class="row-label">Model</span>
          <span id="model-list-current" class="row-value">Loading…</span>
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
            <polyline points="9 6 15 12 9 18"></polyline>
          </svg>
        </button>
        <button id="effort-list-trigger" class="popover-row" type="button" aria-haspopup="listbox" aria-expanded="false" aria-controls="effort-list">
          <span class="row-label">Effort</span>
          <span id="effort-list-current" class="row-value">Pro</span>
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
            <polyline points="9 6 15 12 9 18"></polyline>
          </svg>
        </button>
      </div>

      <ul id="model-list" class="popover model-list" role="listbox" aria-label="Models" hidden>
        <li class="model-option" role="option" aria-selected="false" aria-disabled="true">Loading models…</li>
      </ul>

      <div id="effort-list" class="popover effort-list" role="dialog" aria-label="Effort options" hidden>
        <h3 class="effort-list-title"><span>Effort</span></h3>
        <ul id="effort-listbox" class="effort-listbox" role="listbox" aria-label="Effort levels">
          <li class="effort-option" role="option" aria-selected="false" tabindex="-1" data-effort="Instant"><span>Instant</span></li>
          <li class="effort-option" role="option" aria-selected="false" tabindex="-1" data-effort="Medium"><span>Medium</span></li>
          <li class="effort-option" role="option" aria-selected="false" tabindex="-1" data-effort="High"><span>High</span></li>
          <li class="effort-option" role="option" aria-selected="false" tabindex="-1" data-effort="Extra High"><span>Extra High</span></li>
          <li class="effort-option" role="option" aria-selected="true" tabindex="-1" data-effort="Pro"><span>Pro</span></li>
        </ul>
      </div>

      <div class="model-select-fallback" hidden>
        <label for="model-select">Model</label>
        <select id="model-select">
          <option value="">Loading models…</option>
        </select>
      </div>
    </form>
  </main>
</div>

<noscript><p class="error" role="alert">This console requires JavaScript.</p></noscript>
<script src="/static/app.js"></script>
</body>
</html>
